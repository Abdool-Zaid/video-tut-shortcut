<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookmarklet test page</title>
   
</head>
<body>
    <script>
        window.addEventListener("load",()=>{
            //include in compile
            let rand_num = Math.round(Math.random()*100)
            let default_search = "fun facts about  the number " + rand_num  
            let search_dialog = document.createElement("dialog")
            let search_field = document.createElement("input")
            let search_btn = document.createElement("button")
            let style_sheet =  new CSSStyleSheet()

            search_btn.textContent = "search"
            search_field.placeholder = default_search

            style_sheet.insertRule(` .dialog {
            background-color : black;
            padding:0;
            display:flex;
            width:34vw;
            border:none
            } `)
             style_sheet.insertRule(`#search_field{
              	box-sizing: content-box;
                color:white;
                height:2rem;
                width: 28vw;
	            -webkit-appearance: none;
	            -moz-appearance: none;

             }`)
             style_sheet.insertRule(`#search_field:focus {
                outline: none;
                 box-shadow: none;
                border-color: inherit;
            }`);
            style_sheet.insertRule(` .dialog_inverse {
            background-color : white;   

            border: 1px white;
            } `)


            search_dialog.classList.add("dialog")
            search_field.classList.add("dialog")
            search_field.id="search_field"
            search_btn.classList.add("dialog_inverse")
            search_dialog.appendChild(search_field)
            search_dialog.appendChild(search_btn)
            
            document.adoptedStyleSheets.push(style_sheet)// injection happens here
            document.body.appendChild(search_dialog) // injection happens here

            search_btn.addEventListener("click",()=>{
               run_search()
            })

            search_field.addEventListener("keydown",(event)=>{
               
                if(event.key == "Enter"){
                    run_search()
                }
            })
            search_dialog.showModal() //init


            
            function search_youtube () {
                let slug = search_field.value.length > 0 ? search_field.value : default_search 
                
                let url_prefix = new URL("https://www.youtube.com/results?")
                let search_parameter = new URLSearchParams(url_prefix.search)
                search_parameter.append("search_query", slug)
                
                let full_url = new URL(url_prefix + search_parameter.toString()) 
                return full_url

            }

            function open_new_window (url){
                window.open(url.href, "youtube");

            }
            function run_search(){
                open_new_window(search_youtube())
               search_dialog.close() // investigate if this line is needed 
                document.body.removeChild(search_dialog)
            }
            //include in compile
        })
    </script>
</body>
</html>
